<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 用 device-width 而不是写死 1600：写死会让手机/平板整页等比缩小，字小到看不清 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 站点图标：不加这一行，浏览器会去要 /favicon.ico 而拿到 404（每次加载一条错） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>边坡哨兵 · 滑坡灾害协同感知与预警系统</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
